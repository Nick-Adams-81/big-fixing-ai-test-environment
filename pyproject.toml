[project]
name = "bug-fixer-frontier"
version = "0.1.0"
description = "Training and evaluation environment for AI coding agents that fix bugs"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
